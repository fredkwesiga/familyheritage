# Local development infrastructure only.
# Nothing here is required in production - in production the database is a
# managed Postgres instance (Neon / Supabase free tier) reached via DATABASE_URL.
services:
  postgres:
    image: postgres:16-alpine
    container_name: fh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fh_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-family_heritage}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - fh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fh} -d ${POSTGRES_DB:-family_heritage}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fh_pgdata:
